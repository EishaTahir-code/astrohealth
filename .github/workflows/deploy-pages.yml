# Puts Orbloom online for free with GitHub Pages, so it opens on any phone or computer:
#   https://eishatahir-code.github.io/astrohealth/
# It runs by itself every time something new is pushed to the main branch
# (and can be started by hand from the Actions tab: "Run workflow").
#
# One-time setup (on github.com): Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy Orbloom to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: npm ci
        working-directory: client
      - name: Build
        run: npm run build
        working-directory: client
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
